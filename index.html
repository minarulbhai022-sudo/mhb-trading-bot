<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHB Signal Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body { background: #08090d; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
    
    .card { background: #0e1118; width: 100%; max-width: 380px; border-radius: 24px; border: 1px solid #1a1f2c; padding: 24px 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); position: relative; }
    
    /* Market Switcher */
    .market-switch { display: flex; background: #08090d; padding: 5px; border-radius: 14px; margin-bottom: 22px; border: 1px solid #161b26; }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 12px; font-weight: 800; cursor: pointer; border-radius: 10px; color: #6b7280; letter-spacing: 0.5px; transition: 0.3s; }
    .tab.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; box-shadow: 0 4px 15px rgba(139,92,246,0.4); }
    
    /* Input Groups */
    .input-group { margin-bottom: 18px; }
    label { display: block; font-size: 11px; color: #6b7280; margin-bottom: 8px; font-weight: 700; letter-spacing: 1px; }
    select { width: 100%; padding: 14px; background: #08090d; border: 1px solid #1c2230; color: #fff; border-radius: 12px; font-size: 14px; font-weight: 700; outline: none; appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b5cf6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 14px center; background-size: 16px; }
    
    /* Active Strategies */
    .section-title { text-align: center; font-size: 11px; color: #6b7280; font-weight: 700; letter-spacing: 1px; margin: 20px 0 12px; }
    .strategies { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px; }
    .chip { font-size: 11px; background: rgba(139,92,246,0.08); border: 1px solid #6366f1; color: #d8b4fe; padding: 7px 14px; border-radius: 10px; font-weight: 600; }
    
    /* Usage Pill */
    .usage-pill { text-align: center; background: #131722; color: #9ca3af; font-size: 12px; font-weight: 600; padding: 8px 16px; border-radius: 20px; width: fit-content; margin: 0 auto 25px; border: 1px solid #1f293d; }
    
    /* Circular Generate Button */
    .btn-container { display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
    .circular-btn { width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle, #0e1118 40%, #08090d 100%); border: 2px solid #8b5cf6; box-shadow: 0 0 25px rgba(139,92,246,0.3); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; position: relative; }
    .circular-btn:active { transform: scale(0.95); box-shadow: 0 0 35px rgba(139,92,246,0.6); }
    .bolt-icon { color: #a855f7; margin-bottom: 8px; }
    .btn-text { font-size: 13px; font-weight: 800; color: #ffffff; letter-spacing: 1px; text-align: center; line-height: 1.2; }
    .wave-line { margin-top: 8px; color: #8b5cf6; font-size: 16px; opacity: 0.8; }
    
    /* Signal Result Popup/Display */
    .result-box { display: none; text-align: center; margin-top: 15px; padding: 12px; background: #08090d; border-radius: 12px; border: 1px solid #27272a; }
    .call-text { color: #22c55e; font-size: 20px; font-weight: 800; }
    .put-text { color: #ef4444; font-size: 20px; font-weight: 800; }
    .accuracy-text { font-size: 11px; color: #9ca3af; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="market-switch">
      <div class="tab active" id="tabOtc" onclick="switchMarket('otc')">OTC MARKET</div>
      <div class="tab" id="tabReal" onclick="switchMarket('real')">REAL MARKET</div>
    </div>

    <div class="input-group">
      <label>ASSET</label>
      <select id="assetSelect"></select>
    </div>

    <div class="input-group">
      <label>TIMEFRAME</label>
      <select id="tfSelect">
        <option value="1">1 MINUTE</option>
        <option value="2">2 MINUTES</option>
        <option value="5">5 MINUTES</option>
      </select>
    </div>

    <div class="section-title">ACTIVE STRATEGIES</div>
    <div class="strategies">
      <span class="chip">EMA + RSI</span>
      <span class="chip">Price Action</span>
      <span class="chip">Bollinger Bands</span>
      <span class="chip">OTC Trend</span>
      <span class="chip">Support/Resistance</span>
    </div>

    <div class="usage-pill"><span id="signalsUsed">0</span>/1 Free Signals Used today</div>

    <div class="btn-container">
      <div class="circular-btn" onclick="generateSignal()">
        <svg class="bolt-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <div class="btn-text">GENERATE<br>SIGNAL</div>
        <div class="wave-line">〰〰</div>
      </div>
    </div>

    <div class="result-box" id="resultBox">
      <div id="signalText"></div>
      <div class="accuracy-text" id="accuracyText"></div>
    </div>
  </div>

  <script>
    const otcAssets = ["ADAUSD_otc", "USD/BDT (OTC)", "USD/BRL (OTC)", "EUR/USD (OTC)", "USD/INR (OTC)"];
    const realAssets = ["EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "USD/CAD"];
    let currentMarket = 'otc';
    let usedCount = 0;

    function loadAssets() {
      const select = document.getElementById("assetSelect");
      select.innerHTML = "";
      const list = currentMarket === 'otc' ? otcAssets : realAssets;
      list.forEach(asset => {
        const opt = document.createElement("option");
        opt.value = asset;
        opt.innerText = asset;
        select.appendChild(opt);
      });
    }

    function switchMarket(type) {
      currentMarket = type;
      document.getElementById("tabOtc").classList.toggle("active", type === 'otc');
      document.getElementById("tabReal").classList.toggle("active", type === 'real');
      loadAssets();
    }

    function generateSignal() {
      const box = document.getElementById("resultBox");
      const sigText = document.getElementById("signalText");
      const accText = document.getElementById("accuracyText");

      box.style.display = "block";
      sigText.innerText = "ANALYZING...";
      sigText.className = "";
      accText.innerText = "Processing indicators...";

      setTimeout(() => {
        const isCall = Math.random() > 0.45;
        const accuracy = (89 + Math.random() * 8).toFixed(1);
        
        if (isCall) {
          sigText.innerText = "CALL ↑";
          sigText.className = "call-text";
        } else {
          sigText.innerText = "PUT ↓";
          sigText.className = "put-text";
        }
        accText.innerText = "Accuracy: " + accuracy + "%";

        usedCount++;
        document.getElementById("signalsUsed").innerText = usedCount;
      }, 1000);
    }

    loadAssets();
  </script>
</body>
</html>
