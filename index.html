<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MHB ADVANCED SIGNALS PRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: #10121d;
      --panel-bg: #141724;
      --purple-main: #9367ef;
      --purple-glow: #7c3aed;
      --green-glow: #10b981;
      --red-glow: #ef4444;
      --text-main: #ffffff;
      --text-muted: #848da1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .dashboard {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 28px;
      padding: 24px;
      border: 1px solid rgba(147, 103, 239, 0.1);
      box-shadow: 0 0 40px rgba(147, 103, 239, 0.1);
    }

    /* --- AUTH PANEL (Screen 1) --- */
    .auth-card { text-align: center; padding: 20px 10px; }
    .auth-card h2 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a78bfa, var(--purple-main));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }
    .input-box {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(147, 103, 239, 0.25);
      background: #090b10;
      color: #fff;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      margin-bottom: 20px;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--purple-glow), #6d28d9);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.35);
    }

    /* --- MAIN PANEL (Screen 2) --- */
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .status-text { color: var(--purple-main); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.5px; }
    .btn-logout { background: none; border: none; color: #f87171; cursor: pointer; font-size: 0.8rem; font-weight: 500; }

    .control-group { margin-bottom: 18px; }
    .control-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .select-wrapper { position: relative; }
    .select-wrapper select {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      outline: none;
    }

    .generate-section { text-align: center; margin-top: 40px; }
    .btn-circle {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: #0a0c12;
      border: 3px solid var(--purple-main);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(147, 103, 239, 0.25);
      transition: all 0.3s ease;
    }
    .btn-circle:active { transform: scale(0.95); }
    .btn-circle i { font-size: 2.2rem; color: var(--purple-main); margin-bottom: 6px; }
    .btn-circle span { font-weight: 800; font-size: 0.95rem; line-height: 1.2; text-transform: uppercase; }

    /* --- SIGNAL POPUP (Screen 3 - DESIGN MATCH) --- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(4, 5, 8, 0.95);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 15px;
    }

    .modal-card {
      background: #0a0c13;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 28px;
      width: 100%;
      max-width: 370px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Popup Header */
    .p-header {
      padding: 20px 24px;
      text-align: center;
      position: relative;
    }
    .btn-p-close {
      position: absolute;
      top: 18px; right: 20px;
      background: none; border: none; color: var(--text-muted);
      font-size: 1.3rem; cursor: pointer;
    }
    .p-check-icon {
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(147, 103, 239, 0.1);
      border: 2px solid var(--purple-main);
      color: var(--purple-main);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px auto;
      font-size: 1.4rem;
    }
    .p-header h3 { font-size: 1.4rem; font-weight: 800; margin-bottom: 2px; }
    .p-header h3 span:first-child { color: white; }
    .p-header h3 span:last-child { color: var(--purple-main); }
    .p-header p { color: var(--text-muted); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    /* Trade Time Bar */
    .p-time-bar {
      background: var(--panel-bg);
      padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
    .p-time-lbl { display: flex; align-items: center; color: var(--text-muted); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .p-time-lbl i { margin-right: 8px; font-size: 1.1rem; }
    .p-time-val { color: var(--purple-main); font-weight: 700; font-size: 1rem; }

    /* Signal Area (With Chart Background) */
    .p-signal-body {
      padding: 30px 24px;
      text-align: center;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMjAwIDEwMCI+PHJlY3QgeD0iMTAiIHk9IjMwIiB3aWR0aD0iNCIgaGVpZ2h0PSI0MCIgZmlsbD0iI2VmNDQ0NCIgZmlsbC1vcGFjaXR5PSIwLjE1Ii8+PHJlY3QgeD0iMTIiIHk9IjE1IiB3aWR0aD0iMCIgaGVpZ2h0PSI3MCIgZmlsbD0iI2VmNDQ0NCIgZmlsbC1vcGFjaXR5PSIwLjE1Ii8+PHJlY3QgeD0iMjUiIHk9IjEwIiB3aWR0aD0iNCIgaGVpZ2h0PSI1MCIgZmlsbD0iIzEwYjk4MSIgZmlsbC1vcGFjaXR5PSIwLjE1Ii8+PHJlY3QgeD0iMjciIHk9IjUiIHdpZHRoPSIwIiByZWN0PSIxMDAiIGZpbGw9IiMxMGI5ODEiIGZpbGwtb3BhY2l0eT0iMC4xNSIvPjxyZWN0IHg9IjQwIiB5PSI0NSIgd2lkdGg9IjQiIGhlaWdodD0iMzAiIGZpbGw9IiNlZjQ0NDQiIGZpbGwtb3BhY2l0eT0iMC4xNSIvPjwvc3ZnPg==');
      background-size: cover;
      position: relative;
    }
    .p-direction-lbl { color: var(--red-glow); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .p-direction-val { font-size: 2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .p-direction-val.put { color: var(--red-glow); }
    .p-direction-val.call { color: var(--green-glow); }
    .p-arrow { font-size: 3.5rem; }
    .p-arrow.put { color: var(--red-glow); filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.4)); }
    .p-arrow.call { color: var(--green-glow); filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.4)); transform: rotate(180deg); }

    /* Grid Info */
    .p-grid-info {
      background: var(--panel-bg);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      display: grid; grid-template-columns: 1fr 1.2fr 1fr;
    }
    .p-grid-item {
      padding: 16px;
      text-align: center;
      border-right: 1px solid rgba(255, 255, 255, 0.03);
    }
    .p-grid-item:last-child { border-right: none; }
    .p-item-icon { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 5px; }
    .p-item-lbl { font-size: 0.6rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 3px; }
    .p-item-val { font-weight: 800; font-size: 0.85rem; color: white; }

    /* Analysed Bar */
    .p-analysed-bar {
      padding: 10px 24px;
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
    .p-analysed-bar i { margin-right: 5px; color: var(--purple-main); }
    .p-analysed-bar span { color: white; font-weight: 600; }

    /* Strategy Tags */
    .p-strategy-tags {
      padding: 12px 24px 20px 24px;
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
    .p-tag {
      font-size: 0.6rem; font-weight: 700;
      color: var(--purple-main); text-transform: uppercase;
      padding: 5px 10px; border-radius: 20px;
      background: rgba(147, 103, 239, 0.06);
      border: 1px solid rgba(147, 103, 239, 0.15);
    }

    /* Key indicator bar (Bottom) */
    .p-indicator-bar {
      padding: 14px 24px;
      background: #080a11;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
    .p-indicator-bar i { margin-right: 6px; color: var(--green-glow); }
    .p-indicator-bar span { font-weight: 500; }
  </style>
</head>
<body>

  <div class="dashboard">

    <!-- LOGIN SCREEN -->
    <div id="auth-panel" class="auth-card">
      <h2>SignalForge VIP</h2>
      <p>Enter License Key for AI Precision</p>
      <input type="text" id="license-key-input" class="input-box" placeholder="SF-VIP-XXXX" />
      <button id="activate-btn" class="btn-submit">UNLOCK ACCESS</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-panel" style="display: none;">
      
      <div class="dashboard-header">
        <span class="status-text">MHB VIP ACCESS</span>
        <button id="logout-btn" class="btn-logout">Logout</button>
      </div>

      <!-- CONTROLS -->
      <div class="control-group">
        <label>ASSET</label>
        <div class="select-wrapper">
          <select id="asset-select">
            <option value="USDBDT-OTC">USDBDT-OTC</option>
            <option value="EURUSD-OTC">EURUSD-OTC</option>
            <option value="GBPUSD-OTC">GBPUSD-OTC</option>
          </select>
        </div>
      </div>

      <div class="control-group">
        <label>TIMEFRAME</label>
        <div class="select-wrapper">
          <select id="timeframe">
            <option value="1-MINUTE SIGNAL">1 MINUTE (VIP TURBO)</option>
          </select>
        </div>
      </div>

      <!-- GENERATE BUTTON -->
      <div class="generate-section">
        <button class="btn-circle" id="generate-btn">
          <i class="ph-fill ph-lightning"></i>
          <span>GENERATE<br>SIGNAL</span>
        </button>
      </div>

    </div>

  </div>

  <!-- MODAL / POPUP (NEW ADVANCED DESIGN) -->
  <div class="modal-overlay" id="signal-modal">
    <div class="modal-card">
      <button class="btn-p-close" onclick="closeModal()">×</button>
      
      <div class="p-header">
        <div class="p-check-icon"><i class="ph ph-check"></i></div>
        <h3><span>SIGNAL</span> <span>GENERATED</span></h3>
        <p>1-MINUTE SIGNAL</p>
      </div>

      <div class="p-time-bar">
        <div class="p-time-lbl"><i class="ph ph-calendar-blank"></i>TRADE TIME</div>
        <div class="p-time-val" id="p-time">--:--</div>
      </div>

      <div class="p-signal-body">
        <div class="p-direction-lbl">DIRECTION</div>
        <div class="p-direction-val put" id="p-direction">PUT</div>
        <div class="p-arrow put" id="p-arrow">▼</div>
      </div>

      <div class="p-grid-info">
        <div class="p-grid-item">
          <div class="p-item-icon"><i class="ph ph-target"></i></div>
          <div class="p-item-lbl">ASSET</div>
          <div class="p-item-val" id="p-asset">--</div>
        </div>
        <div class="p-grid-item">
          <div class="p-item-icon"><i class="ph ph-currency-dollar"></i></div>
          <div class="p-item-lbl">PRICE</div>
          <div class="p-item-val" id="p-price">117.----</div>
        </div>
        <div class="p-grid-item">
          <div class="p-item-icon"><i class="ph ph-chart-line-up"></i></div>
          <div class="p-item-lbl">ACCURACY</div>
          <div class="p-item-val">98% 🔥</div>
        </div>
      </div>

      <div class="p-analysed-bar">
        <i class="ph ph-chart-bar"></i>Analyzed <span>250 Candles</span>
      </div>

      <div class="p-strategy-tags">
        <span class="p-tag">EMA RSI</span>
        <span class="p-tag">PRICE ACTION</span>
        <span class="p-tag">BOLLINGER</span>
        <span class="p-tag">OTC TREND</span>
        <span class="p-tag">SNR</span>
      </div>

      <div class="p-indicator-bar">
        <i class="ph ph-info"></i>
        <span>EMA+RSI Bearish | Price Action Bearish | OTC Trend...</span>
      </div>

    </div>
  </div>

  <script>
    const validKeys = ["SF-PRO-9821"];
    const authPanel = document.getElementById('auth-panel');
    const mainPanel = document.getElementById('main-panel');
    const licenseInput = document.getElementById('license-key-input');
    const modal = document.getElementById('signal-modal');
    const generateBtn = document.getElementById('generate-btn');
    const assetSelect = document.getElementById('asset-select');

    // UI elements to update in popup
    const pTime = document.getElementById('p-time');
    const pDirection = document.getElementById('p-direction');
    const pArrow = document.getElementById('p-arrow');
    const pAsset = document.getElementById('p-asset');

    document.getElementById('activate-btn').addEventListener('click', () => {
      if (validKeys.includes(licenseInput.value.trim())) {
        authPanel.style.display = 'none';
        mainPanel.style.display = 'block';
      } else {
        alert('Invalid Key! Use: SF-PRO-9821');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      mainPanel.style.display = 'none';
      authPanel.style.display = 'block';
      licenseInput.value = '';
    });

    generateBtn.addEventListener('click', () => {
      // Simulate analysis time (optional, matching previous interaction)
      // Here we directly show the popup with data
      
      const isCall = Math.random() > 0.5;
      const now = new Date();
      now.setMinutes(now.getMinutes() + 1); // Signal is for next minute
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

      // Update popup content
      pTime.innerText = timeStr;
      pAsset.innerText = assetSelect.value;
      
      if(isCall) {
        pDirection.innerText = 'CALL';
        pDirection.className = 'p-direction-val call';
        pArrow.innerText = '▲';
        pArrow.className = 'p-arrow call';
        document.querySelector('.p-direction-lbl').style.color = '#10b981';
      } else {
        pDirection.innerText = 'PUT';
        pDirection.className = 'p-direction-val put';
        pArrow.innerText = '▼';
        pArrow.className = 'p-arrow put';
        document.querySelector('.p-direction-lbl').style.color = '#ef4444';
      }

      modal.style.display = 'flex';
    });

    function closeModal() {
      modal.style.display = 'none';
    }
  </script>
</body>
      </html>
