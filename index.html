<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MHB HIGH-ACCURACY SIGNALS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
  <style>
    :root {
      --bg-dark: #0b0d14;
      --card-bg: #121524;
      --purple-main: #8b5cf6;
      --purple-glow: #7c3aed;
      --green-glow: #10b981;
      --red-glow: #ef4444;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .dashboard {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px;
      border: 1px solid rgba(139, 92, 246, 0.2);
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
    }

    .auth-card { text-align: center; padding: 20px 10px; }
    .auth-card h2 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a78bfa, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }

    .input-box {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(139, 92, 246, 0.3);
      background: rgba(15, 18, 30, 0.8);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      margin-bottom: 15px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
    }

    .market-toggles {
      display: flex;
      gap: 10px;
      background: rgba(15, 18, 30, 0.8);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 20px;
    }

    .market-toggle-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }

    .market-toggle-btn.active {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
    }

    .control-group { margin-bottom: 15px; }
    .control-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .select-wrapper select {
      width: 100%;
      padding: 12px 15px;
      border-radius: 12px;
      background: rgba(15, 18, 30, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.2);
      color: white;
      font-weight: 600;
      outline: none;
    }

    .strategy-section { margin: 20px 0; }
    .strategy-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-align: center;
    }

    .strategy-toggles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .strategy-toggle {
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #a78bfa;
      font-weight: 600;
    }

    .generate-section { text-align: center; margin-top: 25px; }
    .limit-indicator { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; }

    .btn-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,0.2) 0%, rgba(18,21,36,1) 70%);
      border: 3px solid #7c3aed;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.4);
      transition: all 0.3s ease;
    }

    .btn-circle:active { transform: scale(0.95); }
    .btn-circle i { font-size: 2.2rem; color: #a78bfa; margin-bottom: 5px; }
    .btn-circle span { font-weight: 800; font-size: 1rem; line-height: 1.2; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-card {
      background: var(--card-bg);
      border: 2px solid var(--purple-main);
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.5);
    }

    .signal-res { font-size: 2.2rem; font-weight: 800; margin: 12px 0; }
    .signal-res.call { color: var(--green-glow); }
    .signal-res.put { color: var(--red-glow); }

    .close-btn {
      margin-top: 15px;
      padding: 10px 25px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="dashboard">

    <!-- LOGIN SCREEN -->
    <div id="auth-panel" class="auth-card">
      <h2>SignalForge Pro V2</h2>
      <p>High Precision AI Engine</p>
      <input type="text" id="license-key-input" class="input-box" placeholder="SF-PRO-XXXX" />
      <button id="activate-btn" class="btn-submit">ACTIVATE LICENSE</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-panel" style="display: none;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <span style="color: #a78bfa; font-weight: 700; font-size: 0.9rem;">MHB VIP ACCURACY BOT</span>
        <button id="logout-btn" style="background: none; border: none; color: var(--red-glow); cursor: pointer; font-size: 0.85rem;">Logout</button>
      </div>

      <!-- MARKET TOGGLE -->
      <div class="market-toggles">
        <button id="btn-otc" class="market-toggle-btn active" onclick="switchMarket('otc')">OTC MARKET</button>
        <button id="btn-real" class="market-toggle-btn" onclick="switchMarket('real')">REAL MARKET</button>
      </div>

      <!-- CONTROLS -->
      <div class="control-group">
        <label>SELECT ASSET PAIR</label>
        <div class="select-wrapper">
          <select id="asset-select"></select>
        </div>
      </div>

      <div class="control-group">
        <label>TIMEFRAME</label>
        <div class="select-wrapper">
          <select id="timeframe">
            <option value="1">1 MINUTE (VIP Turbo)</option>
            <option value="5">5 MINUTES (Safe Trend)</option>
          </select>
        </div>
      </div>

      <!-- HIGH ACCURACY STRATEGIES -->
      <div class="strategy-section">
        <p class="strategy-label">ACTIVE HIGH-ACCURACY ALGORITHMS</p>
        <div class="strategy-toggles">
          <span class="strategy-toggle">EMA (9,21) + RSI (14)</span>
          <span class="strategy-toggle">Price Action S/R</span>
          <span class="strategy-toggle">Bollinger Breakout</span>
          <span class="strategy-toggle">OTC Volume Trend</span>
          <span class="strategy-toggle">MACD Reversal</span>
        </div>
      </div>

      <!-- GENERATE BUTTON -->
      <div class="generate-section">
        <div class="limit-indicator" id="limit-text">0/5 Signals Used Today</div>
        <button class="btn-circle" id="generate-btn">
          <i class="ph-fill ph-lightning"></i>
          <span>GENERATE<br>VIP SIGNAL</span>
        </button>
      </div>

    </div>

  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="signal-modal">
    <div class="modal-card">
      <h3 id="modal-title">ANALYZING...</h3>
      <div id="modal-body">
        <p style="color: var(--text-muted); margin-top: 10px;">Checking multi-indicator convergence...</p>
      </div>
      <button class="close-btn" id="close-modal" style="display:none;" onclick="closeModal()">CLOSE SIGNAL</button>
    </div>
  </div>

  <script>
    const validKeys = ["SF-PRO-9821", "SF-PRO-4410", "SF-PRO-8823"];
    let usedCount = 0;

    // Expanded Asset Lists
    const otcAssets = [
      "ADAUSD_otc", "AUDCAD-OTC", "AUDJPY-OTC", "AUDNZD-OTC", "AUDUSD-OTC",
      "BRLUSD-OTC", "BTCUSD-OTC", "CADCHF-OTC", "CADJPY-OTC", "EURAUD-OTC",
      "EURCAD-OTC", "EURCHF-OTC", "EURGBP-OTC", "EURJPY-OTC", "EURUSD-OTC",
      "GBPAUD-OTC", "GBPCAD-OTC", "GBPJPY-OTC", "GBPUSD-OTC", "NZDUSD-OTC",
      "USDBDT-OTC", "USDCAD-OTC", "USDCHF-OTC", "USDIDR-OTC", "USDINR-OTC",
      "USDJPY-OTC", "USDPKR-OTC", "XAUUSD-OTC (Gold)"
    ];

    const realAssets = [
      "EUR/USD (Real)", "GBP/USD (Real)", "USD/JPY (Real)", "USD/CHF (Real)",
      "AUD/USD (Real)", "USD/CAD (Real)", "EUR/GBP (Real)", "EUR/JPY (Real)",
      "GBP/JPY (Real)", "EUR/CAD (Real)", "AUD/JPY (Real)", "CAD/JPY (Real)"
    ];

    const authPanel = document.getElementById('auth-panel');
    const mainPanel = document.getElementById('main-panel');
    const licenseInput = document.getElementById('license-key-input');
    const activateBtn = document.getElementById('activate-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const assetSelect = document.getElementById('asset-select');
    const generateBtn = document.getElementById('generate-btn');
    const limitText = document.getElementById('limit-text');
    const modal = document.getElementById('signal-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const closeModalBtn = document.getElementById('close-modal');

    function populateAssets(list) {
      assetSelect.innerHTML = '';
      list.forEach(asset => {
        const opt = document.createElement('option');
        opt.value = asset;
        opt.innerText = asset;
        assetSelect.appendChild(opt);
      });
    }

    populateAssets(otcAssets);

    function switchMarket(type) {
      document.getElementById('btn-otc').classList.toggle('active', type === 'otc');
      document.getElementById('btn-real').classList.toggle('active', type === 'real');
      populateAssets(type === 'otc' ? otcAssets : realAssets);
    }

    activateBtn.addEventListener('click', () => {
      if (validKeys.includes(licenseInput.value.trim())) {
        authPanel.style.display = 'none';
        mainPanel.style.display = 'block';
      } else {
        alert('Invalid Key! Use: SF-PRO-9821');
      }
    });

    logoutBtn.addEventListener('click', () => {
      mainPanel.style.display = 'none';
      authPanel.style.display = 'block';
      licenseInput.value = '';
    });

    generateBtn.addEventListener('click', () => {
      if (usedCount >= 5) {
        alert('Daily Limit Reached! (5/5 Used)');
        return;
      }

      modal.style.display = 'flex';
      modalTitle.innerText = "HIGH-ACCURACY SCANNING...";
      modalBody.innerHTML = `
        <div style="margin-top: 15px; color: var(--text-muted); font-size: 0.9rem;">
          <p>⚡ EMA + RSI Cross Confirming...</p>
          <p>📊 Checking Price Action Levels...</p>
        </div>
      `;
      closeModalBtn.style.display = 'none';

      setTimeout(() => {
        usedCount++;
        limitText.innerText = `${usedCount}/5 Signals Used Today`;

        const isCall = Math.random() > 0.48;
        const signalType = isCall ? 'CALL (BUY ⬆)' : 'PUT (SELL ⬇)';
        const colorClass = isCall ? 'call' : 'put';
        // High Accuracy Score Range (92% to 98%)
        const accuracyScore = (92 + Math.floor(Math.random() * 7)).toString();

        modalTitle.innerText = "HIGH ACCURACY SIGNAL";
        modalBody.innerHTML = `
          <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 5px;">ASSET: <b style="color:#fff">${assetSelect.value}</b></div>
          <div class="signal-res ${colorClass}">${signalType}</div>
          <div style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); padding: 8px; border-radius: 10px; color: #10B981; font-weight: 700; font-size: 0.9rem;">
            🎯 CONFIDENCE / ACCURACY: ${accuracyScore}%
          </div>
        `;
        closeModalBtn.style.display = 'inline-block';
      }, 2500);
    });

    function closeModal() { modal.style.display = 'none'; }
  </script>
</body>
                                                                     </html>
